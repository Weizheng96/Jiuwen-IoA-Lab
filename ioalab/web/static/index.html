<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九问IoA仿真平台 · 用户端</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand">九问IoA仿真平台<small>Jiuwen IoA Lab · 用户端</small></div>
  <div class="spacer"></div>
  <span id="modeTag" class="badge info"></span>
  <span class="who" id="whoBox"><span class="dot"></span><b id="whoName"></b></span>
  <span class="who" id="walletBox">余量 <b id="walletTop" class="mono" style="color:var(--c-pay)">0.00</b>&nbsp;虚拟币</span>
  <button class="btn sm hide" id="btnLogout">退出</button>
</div>

<!-- 注册 / 登录 -->
<div class="page" id="authView">
  <div class="panel user auth">
    <h2>注册 / 登录</h2>
    <div class="tabs">
      <button class="on" data-auth="register">注册</button>
      <button data-auth="login">登录</button>
    </div>
    <div class="form">
      <label>用户名</label><input id="username" placeholder="3–32 位字母、数字、_ . -" autocomplete="username">
      <label>密码</label><input id="password" type="password" placeholder="至少 6 位（服务器模式 8 位）" autocomplete="current-password">
      <label id="lbName">显示名</label><input id="displayName" placeholder="可留空，默认同用户名">
      <label id="lbInvite" class="hide">邀请码</label><input id="invite" class="hide" placeholder="由管理员生成">
      <div class="full"><button class="btn primary" id="btnAuth" style="width:100%">注册并登录</button></div>
      <div class="full hint" id="authHint">每自然日首次登录赠送虚拟币。内部账号 ISP_001… / ISC_001… 的密码是序号（001…）。</div>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div class="page hide" id="mainView">
  <div class="pending hide" id="pendingBox">
    <h3>待确认事项</h3>
    <div id="pendingList"></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <div class="panel user">
        <h2>我的身份 <span class="tag">账号可同时持有</span></h2>
        <div id="identity"></div>
      </div>
      <div class="panel pay">
        <h2>钱包 <span class="tag">虚拟币 · 只记过账</span><span class="tools"><button class="btn sm" id="btnWalletRefresh">刷新流水</button></span></h2>
        <div class="kv"><dt>余量</dt><dd><b id="walletBal" class="mono" style="font-size:22px;color:var(--c-pay)">0.00</b> 虚拟币</dd></div>
        <div id="walletLog" style="margin-top:10px"></div>
      </div>
    </div>
    <div class="stack">
      <div class="panel">
        <h2>给助手下需求 <span class="tag">连接授权</span></h2>
        <div class="form">
          <label>一句话需求</label><textarea id="needText" placeholder="例：帮我的奶茶店「茶小满」写三条朋友圈文案，主题春日上新"></textarea>
          <label>预算上限</label><div class="row"><input id="needBudget" type="number" value="30" min="1" step="1" style="max-width:160px"><span class="hint">虚拟币 · 合计超过预算的卡助手不会签</span></div>
          <label>可委托类别</label><div class="row"><input id="needCategory" list="catList" value="不限" style="max-width:260px"><datalist id="catList"><option value="不限"><option value="文案"><option value="翻译"><option value="设计"><option value="咨询"><option value="写作"></datalist></div>
          <label>亲签</label>
          <div class="row" style="gap:28px">
            <span class="sw" id="swSign1"><span class="tg"></span>定约亲签（签1）</span>
            <span class="sw" id="swSign7"><span class="tg"></span>验收亲签（签7）</span>
          </div>
          <label>仿真代签</label>
          <div class="row"><span class="sw on" id="swAuto"><span class="tg"></span>开</span><span class="hint">开：平台替你点「本次允许」；关：每一步在上方「待确认事项」里由你答复</span></div>
          <div class="full"><button class="btn primary" id="btnNeed">交给助手</button></div>
        </div>
      </div>
      <div class="panel market">
        <h2>我的需求 <span class="tools"><span class="mute">每 3 秒刷新</span></span></h2>
        <div id="needList"></div>
      </div>
      <div class="panel provider">
        <h2>我的订单 <span class="tag">合同卡</span></h2>
        <div id="orderList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 订单详情 -->
<div class="modal" id="orderModal"><div class="box">
  <h2>订单详情 <code id="omCd" class="mono fg2"></code><span class="x" id="omClose">×</span></h2>
  <div id="omBody"></div>
</div></div>
<!-- 需求详情 -->
<div class="modal" id="needModal"><div class="box">
  <h2>需求详情 <code id="nmId" class="mono fg2"></code><span class="x" id="nmClose">×</span></h2>
  <div id="nmBody"></div>
</div></div>

<script src="/static/common.js"></script>
<script src="/static/index.js"></script>
</body>
</html>
