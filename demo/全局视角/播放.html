<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>九问IoA实验平台 · 全局演示</title>
<style>html,body{margin:0;background:#070e18;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}video{width:100%;height:100%;object-fit:contain}video[hidden]{display:none}#label{position:absolute;right:24px;top:16px;color:#c4e6e5;background:#0b1c2de8;padding:8px 14px;border-radius:10px;font-size:16px}button{position:absolute;right:24px;bottom:22px;padding:8px 16px;background:#173a45;color:#d3f2ef;border:1px solid #568b8e;border-radius:9px;cursor:pointer}</style></head>
<body><video id="film" src="../out/01-global.mp4" controls></video><video id="monitor" src="../assets/run/global/monitor.mp4" muted loop playsinline hidden></video><span id="label" hidden>真实管理员监控 · 录屏循环回放 · 独立实验客户端</span><button id="switch">直接查看监控回放</button>
<script>
'use strict';
const film=document.getElementById('film'),monitor=document.getElementById('monitor'),label=document.getElementById('label'),button=document.getElementById('switch');
function play(video){return video.play().catch(error=>{if(error.name==='AbortError')return;video.controls=true;label.hidden=false;label.textContent='请点击视频播放：'+error.name;});}
function showMonitor(){film.pause();film.hidden=true;monitor.hidden=false;label.hidden=false;button.textContent='重新播放讲解';return play(monitor);}
film.addEventListener('ended',showMonitor);
button.addEventListener('click',()=>{
 if(!film.hidden){showMonitor();return;}
 monitor.pause();monitor.hidden=true;label.hidden=true;film.hidden=false;film.currentTime=0;button.textContent='直接查看监控回放';play(film);
});
</script></body></html>
