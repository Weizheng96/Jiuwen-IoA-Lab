[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-jiuwen"
dynamic = ["version"]
description = "Public Jiuwen Process SDK host adapter for IoA Lab"
requires-python = ">=3.11"
dependencies = ["ioalab-sdk>=0.0.39", "jiuwenswarm-process-sdk==0.1.0"]

[project.scripts]
ioalab-jiuwen = "ioalab_jiuwen.__main__:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["ioalab_jiuwen*"]
