[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-trial"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "websockets>=15,<18", "ioalab-sdk>=0.0.39"]

[project.scripts]
ioalab-trial = "ioalab_trial.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ioalab_trial*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
ioalab_trial = ["*.html"]
