<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoA Lab · 本机用户确认</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#17253a;background:#f3f6fb}body{max-width:1050px;margin:36px auto;padding:0 24px}h1{font-size:28px}p{line-height:1.7;color:#516176}.card{background:white;border:1px solid #dce4f0;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 6px 24px #243a6710}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.state{background:#edf2fb;padding:7px 12px;border-radius:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8fd;padding:18px;border-radius:12px;line-height:1.6;max-height:470px;overflow:auto}button{border:0;border-radius:10px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;background:#175fe6;color:white;margin:10px 12px 0 0}.reject{background:#e9eef6;color:#31445f}button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0}textarea,select{box-sizing:border-box;width:100%;border:1px solid #c9d5e6;border-radius:8px;padding:10px;font:inherit}#error{color:#a52c36}small{color:#66778c}
</style><h1>本机用户确认</h1><p>请核对具体对象、处理范围和工具后再决定。此页面的决定仅适用于显示的原操作。</p><p id="error"></p><main id="cards"></main>
<script>
let csrf='',busy=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={pending:'等待您的决定',approved:'已允许',rejected:'已拒绝',answered:'已答复',expired:'已过期'};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-Ioa-Csrf':csrf}:{},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error?.message||'本机请求失败');return v}
async function refresh(){if(busy)return;try{const data=await api('/user/api');csrf=data.csrf;document.getElementById('cards').innerHTML=data.confirmations.map(item=>{const b=item.binding;let fields='';if(item.kind==='question')fields=item.questions.map((q,index)=>`<label>${esc(q.question||q.title||q.text||'问题 '+(index+1))}${q.options?.length?`<select data-answer="${index}"${q.multi_select?' multiple':''}><option value="">请选择</option>${q.options.map(o=>`<option value="${esc(o.value)}">${esc(o.label||o.text||o.value)}</option>`).join('')}</select>`:''}<textarea data-text="${index}" rows="2" placeholder="您的补充答复"></textarea></label>`).join('');return `<section class="card" data-ref="${esc(item.reference)}" data-digest="${esc(item.bindingDigest)}"><header><b>${esc(b.preview.title||b.action)}</b><span class="state">${esc(labels[item.status]||item.status)}</span></header><p>智能体：${esc(item.agentId)}<br>阶段：${esc(item.stage)} · 动作：${esc(item.action)}</p><pre>${esc(JSON.stringify(b.preview,null,2))}</pre>${fields}${item.status==='pending'?item.kind==='approval'?'<button data-decision="approve">允许此操作</button><button class="reject" data-decision="reject">拒绝</button>':'<button data-decision="answer">提交答复</button>':''}<p><small>有效至 ${esc(new Date(item.expiresAt).toLocaleString())}</small></p></section>`}).join('')||'<section class="card">当前没有待确认操作。</section>';document.getElementById('error').textContent=''}catch(e){document.getElementById('error').textContent=e.message}}
document.getElementById('cards').addEventListener('focusin',()=>busy=true);document.getElementById('cards').addEventListener('focusout',()=>setTimeout(()=>{busy=!!document.querySelector('#cards :focus')},0));
document.getElementById('cards').addEventListener('click',async event=>{const button=event.target.closest('[data-decision]');if(!button)return;const card=button.closest('.card'),body={reference:card.dataset.ref,bindingDigest:card.dataset.digest,decision:button.dataset.decision};if(body.decision==='answer')body.answers=[...card.querySelectorAll('[data-text]')].map(input=>{const choice=card.querySelector(`[data-answer="${input.dataset.text}"]`);return {selected_options:choice?[...choice.selectedOptions].map(option=>option.value).filter(Boolean):[],custom_input:input.value}});busy=true;button.disabled=true;try{await api('/user/decision',body)}catch(e){document.getElementById('error').textContent=e.message}finally{busy=false;await refresh()}});
(async()=>{try{const token=location.hash.slice(1);history.replaceState(null,'','/user');if(token)await api('/user/session',{token});await refresh();setInterval(refresh,1500)}catch(e){document.getElementById('error').textContent=e.message}})();
</script></html>
