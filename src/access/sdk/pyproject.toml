[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-sdk"
dynamic = ["version"]
description = "Local IoA Lab client and provider access, using the A2C SDK"
requires-python = ">=3.11"
dependencies = ["a2c==0.0.19", "a2a-sdk[http-server]==1.0.0", "grpcio>=1.60", "httpx>=0.27", "jsonschema>=4.23", "websockets>=15,<18", "tzdata>=2025.1"]

[project.scripts]
ioalab-client = "ioalab_sdk.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["ioalab_sdk*"]
