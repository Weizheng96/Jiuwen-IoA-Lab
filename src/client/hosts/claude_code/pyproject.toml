[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-claude-code"
dynamic = ["version"]
description = "Official Claude Agent SDK host adapter for IoA Lab"
requires-python = ">=3.11"
dependencies = ["ioalab-sdk>=0.0.168", "claude-agent-sdk==0.2.181"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["ioalab_claude_code*"]
