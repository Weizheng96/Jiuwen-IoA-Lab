[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-codex"
dynamic = ["version"]
description = "Codex App Server host adapter for IoA Lab"
requires-python = ">=3.11"
dependencies = ["ioalab-sdk>=0.0.168"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["ioalab_codex*"]
