<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoA Lab · 业务表单</title><style>/* IOA_STYLE */</style></head>
<body><main>
<header><span class="brand">IoA Lab</span><button id="setupButton" type="button">接入与客户端配置</button><span id="state" class="badge">正在连接</span></header>
<h1 id="title">业务表单</h1><p class="intro">补充所需信息，检查预览，再确认具体操作。</p>
<ol class="steps"><li>填写信息</li><li>检查预览</li><li>确认与结果</li></ol>
<div id="error" role="alert" hidden></div>
<section id="evidenceSection" hidden><h2>当前业务信息</h2><div id="evidence"></div></section>
<form id="fields" novalidate></form>
<section id="previewSection" hidden><h2>操作预览</h2><div id="preview"></div></section>
<section id="resultSection" hidden><h2>处理状态</h2><p id="resultText"></p><details><summary>查看原始回执</summary><pre id="result"></pre></details></section>
<div class="actions"><button id="save" type="button">保存草稿</button><button id="previewButton" type="button">生成预览</button><button id="submit" type="button" class="primary" disabled>提交并申请确认</button><button id="browser" type="button" hidden>打开确认页面</button><button id="refresh" type="button">刷新状态</button><button id="discard" type="button" hidden>放弃本页修改并刷新</button></div>
<p id="hint" class="hint">保存或提交表单不会替代您的批准。需要确认的操作会保持等待，直到您在受控页面作出决定。</p>
</main><script>'use strict';
/* IOA_FIELDS */
/* IOA_VIEWS */
/* IOA_TRANSPORT */
/* IOA_FORMS */
</script></body></html>
