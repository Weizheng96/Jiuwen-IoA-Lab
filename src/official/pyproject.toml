[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioalab-official"
dynamic = ["version"]
description = "Optional official participant business tools and resources for IoA Lab"
requires-python = ">=3.11"
dependencies = ["ioalab-sdk>=0.0.148", "python-dotenv>=1,<2"]

[project.scripts]
ioalab-official = "ioalab_services.__main__:main"
ioalab-admin-assistant = "ioalab_admin_assistant.__main__:main"
ioalab-schedule = "ioalab_tools.schedule_cli:main"
ioalab-agentmail = "ioalab_tools.agentmail_setup:main"
ioalab-outlook = "ioalab_tools.outlook_login:main"

[project.entry-points."ioalab.business_tools"]
calendar = "ioalab_tools.appointments:configure"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["tools", "services", "admin-assistant"]
include = ["ioalab_tools*", "ioalab_services*", "ioalab_admin_assistant*"]
namespaces = false

[tool.setuptools.package-data]
ioalab_services = ["assets/domains/*.json", "assets/verifiers/*.py"]
ioalab_admin_assistant = ["presets.json"]
