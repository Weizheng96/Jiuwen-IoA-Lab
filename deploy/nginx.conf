# 九问IoA仿真平台 · Nginx 反向代理（可选；也可让浏览器直连 IOALAB_BIND:IOALAB_PORT）
# 安装：cp deploy/nginx.conf /etc/nginx/sites-available/ioalab && ln -s ../sites-available/ioalab /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS：apt install certbot python3-certbot-nginx && certbot --nginx -d lab.example.com；随后把 IOALAB_PUBLIC_URL 写成 https://lab.example.com
#        （PUBLIC_URL 首次 init 后不可改，建议部署前就决定用 HTTP 还是 HTTPS）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name lab.example.com;            # 或内网 IP；与 IOALAB_PUBLIC_URL 一致

    client_max_body_size 25m;               # 需求材料上传（单件 ≤ 2 MB，最多 10 件）

    location / {
        proxy_pass http://127.0.0.1:8750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;            # 委托方接口里的签字 / 开工会等服务方回执
    }

    # 管理员实时交易流（WebSocket）
    location /ws/ {
        proxy_pass http://127.0.0.1:8750;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
