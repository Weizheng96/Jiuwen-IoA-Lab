name: stage validation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Explicit validation scope
        type: choice
        required: true
        default: full
        options: [full, deployment, default-deployment]
  schedule:
    - cron: '0 20 * * 0'

permissions:
  contents: read

jobs:
  full:
    if: github.event_name == 'schedule' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      IOALAB_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies once
        run: python -m pip install -r requirements.txt
      - name: Explicit complete regression
        run: python .agents/skills/develop/scripts/check.py --full --report-dir temp/checks/full
      - name: Preserve stage logs and per-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-check-${{ github.sha }}
          path: |
            temp/checks/full/report.json
            temp/checks/full/*.log
            temp/checks/full/pytest.xml
          if-no-files-found: warn

  deployment:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installed Linux release and HTTP WebSocket lifecycle
        run: python tools/verification/verify_deployment.py --output "${{ runner.temp }}/ioalab-deployment" --index https://pypi.org/simple
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-installed-deployment
          path: |
            ${{ runner.temp }}/ioalab-deployment/report.json
            ${{ runner.temp }}/ioalab-deployment/state/.deployment/*.log
            ${{ runner.temp }}/ioalab-deployment/runtime/build/*/*.log
            ${{ runner.temp }}/ioalab-deployment/runtime/envs/*/*.log
          include-hidden-files: true
          if-no-files-found: warn

  default-deployment:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'default-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Default root systemd install and safe upgrade on disposable runner
        run: sudo -n -- "$(command -v python)" -X utf8 -B tools/verification/verify_default_deployment.py --isolated-runner --output /tmp/ioalab-default-${{ github.run_id }}-${{ github.run_attempt }} --index https://pypi.org/simple --seconds 2400
      - name: Preserve only the public lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-default-deployment
          path: /tmp/ioalab-default-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          if-no-files-found: warn
