name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      IOALAB_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e ./src/platform -e ./src/access/sdk
          python -m pip install pytest
      - name: Design version check
        run: python 设计/check.py
      - name: Selfcheck (stub mode)
        run: python tools/selfcheck.py
      - name: Tests (stub mode)
        run: python -m pytest -q tests


  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installed Linux release and HTTP WebSocket lifecycle
        run: python experiments/verify_deployment.py --output "${{ runner.temp }}/ioalab-deployment" --index https://pypi.org/simple
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-installed-deployment
          path: |
            ${{ runner.temp }}/ioalab-deployment/report.json
            ${{ runner.temp }}/ioalab-deployment/**/*.log
          if-no-files-found: warn
