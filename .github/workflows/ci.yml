name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      IOALAB_STUB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e ./src/platform -e ./src/access/sdk
          python -m pip install pytest
      - name: Design version check
        run: python 设计/check.py
      - name: Selfcheck (stub mode)
        run: python tools/selfcheck.py
      - name: Tests (stub mode)
        run: python -m pytest -q tests
