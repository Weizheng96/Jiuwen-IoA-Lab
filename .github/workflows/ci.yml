name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Full commit SHA or explicit refs/heads/... or refs/tags/... on origin
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      IOALAB_STUB: "1"
      CHECK_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch comparison base
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          base = os.environ['CHECK_BASE']
          is_sha = bool(re.fullmatch(r'[0-9a-fA-F]{40}', base))
          if not is_sha:
              if not base.startswith(('refs/heads/', 'refs/tags/')) or subprocess.run(
                  ['git', 'check-ref-format', base], capture_output=True
              ).returncode:
                  raise SystemExit('CHECK_BASE must be a full commit SHA or explicit refs/heads/... or refs/tags/...')
          resolved = None
          if is_sha:
              local = subprocess.run(
                  ['git', 'rev-parse', '--verify', '--end-of-options', base + '^{commit}'],
                  capture_output=True, text=True
              )
              if local.returncode == 0:
                  resolved = local.stdout.strip()
          if resolved is None:
              # Fetch only the selected base, keeping the checked-out HEAD unchanged.
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', base], check=True)
              resolved = subprocess.check_output(
                  ['git', 'rev-parse', '--verify', 'FETCH_HEAD^{commit}'], text=True
              ).strip()
          if is_sha and resolved.lower() != base.lower():
              raise SystemExit('CHECK_BASE SHA must identify a commit directly')
          # Pin branch/tag input once so planning and execution compare the same commits.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('CHECK_BASE=' + resolved + '\n')
          print('Committed comparison base: ' + resolved, flush=True)
          PY
      - name: Select quick scope
        id: scope
        run: python tools/check_scope.py --base "$CHECK_BASE" --github-output "$GITHUB_OUTPUT"
      - name: Install test dependencies once
        if: steps.scope.outputs.tests != '[]'
        run: python -m pip install -r requirements.txt
      - name: Lightweight checks and related tests
        run: python .agents/skills/develop/scripts/check.py --changed-from "$CHECK_BASE" --report-dir temp/checks/ci
      - name: Preserve stage logs and per-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-check-${{ github.sha }}
          path: |
            temp/checks/ci/report.json
            temp/checks/ci/*.log
            temp/checks/ci/pytest.xml
          if-no-files-found: warn
